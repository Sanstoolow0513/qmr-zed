name: QMR Zed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (v followed by the Cargo version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qmr-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  ZED_RELEASE_CHANNEL: stable
  RELEASE_CHANNEL: stable

jobs:
  prepare:
    if: github.repository == 'Sanstoolow0513/qmr-zed'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/qmr-release.py check-tag --tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo Sanstoolow0513/qmr-zed >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
      - name: Test release validation
        run: python3 script/test-qmr-release.py

  remote_server:
    if: github.repository == 'Sanstoolow0513/qmr-zed'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          ./script/linux
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
          compiler_variable="CC_${TARGET//-/_}"
          echo "$compiler_variable=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rust target and WASI SDK
        run: |
          rustup target add "$TARGET"
          ./script/download-wasi-sdk
      - name: Build remote server separately from the client
        run: cargo --config .cargo/bundle-config.toml build --locked --release --package remote_server --target "$TARGET"
      - name: Verify and package server
        run: python script/qmr-release.py package-server --target "$TARGET" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qmr-server-${{ matrix.target }}
          path: target/qmr-release/*
          if-no-files-found: error

  windows_client:
    if: github.repository == 'Sanstoolow0513/qmr-zed'
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and package client
        shell: pwsh
        run: ./script/bundle-qmr-windows.ps1 -Jobs 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qmr-windows-client
          path: |
            target/qmr-dist/qmr-zed-*.zip
          if-no-files-found: error

  publish:
    if: github.repository == 'Sanstoolow0513/qmr-zed'
    needs: [prepare, remote_server, windows_client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: qmr-*
          merge-multiple: true
          path: target/qmr-release
      - name: Verify complete release
        run: python3 script/qmr-release.py verify-assets --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Publish matching client and servers
        run: |
          gh release create "$RELEASE_TAG" target/qmr-release/* \
            --repo Sanstoolow0513/qmr-zed --verify-tag --draft \
            --title "QMR Zed $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --repo Sanstoolow0513/qmr-zed --draft=false
